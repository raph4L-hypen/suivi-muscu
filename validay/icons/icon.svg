<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a10"/>
      <stop offset="0.4" stop-color="#121212"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="120" cy="110" r="620">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff7a2f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" gradientUnits="userSpaceOnUse" cx="980" cy="980" r="420">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ff8a3d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4e0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#e2541a"/>
    </linearGradient>
    <linearGradient id="shaft" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="330" y2="0">
      <stop offset="0" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ffc79a"/>
    </linearGradient>
    <linearGradient id="speed" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="290" y2="0">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="core" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow2)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Traits de vitesse -->
  <g stroke="url(#speed)" stroke-width="24" stroke-linecap="round">
    <line x1="170" y1="380" x2="300" y2="380"/>
    <line x1="140" y1="455" x2="262" y2="455"/>
    <line x1="130" y1="530" x2="250" y2="530"/>
    <line x1="140" y1="605" x2="262" y2="605"/>
    <line x1="170" y1="680" x2="300" y2="680"/>
  </g>

  <!-- Cible -->
  <g filter="url(#shadow)">
    <circle cx="560" cy="530" r="272" fill="url(#white)"/>
    <circle cx="560" cy="530" r="222" fill="#0c0c0c"/>
    <circle cx="560" cy="530" r="190" fill="url(#orange)"/>
    <circle cx="560" cy="530" r="128" fill="#0d0d0d"/>
  </g>

  <!-- Flèche -->
  <g transform="translate(646,478) rotate(-45)" filter="url(#soft)">
    <line x1="0" y1="0" x2="330" y2="0" stroke="#0c0c0c" stroke-width="46" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="330" y2="0" stroke="url(#shaft)" stroke-width="26" stroke-linecap="round"/>
    <polygon points="220,-12 276,-82 332,-82 282,-12" fill="#ff7a2f" stroke="#0c0c0c" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="220,12 276,82 332,82 282,12" fill="#e2541a" stroke="#0c0c0c" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="284,-12 332,-70 380,-70 338,-12" fill="#ffa86a" stroke="#0c0c0c" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="284,12 332,70 380,70 338,12" fill="#ff8a3d" stroke="#0c0c0c" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <!-- Coche -->
  <polyline points="482,530 538,586 646,478" fill="none" stroke="#0c0c0c" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="482,530 538,586 646,478" fill="none" stroke="url(#orange)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
