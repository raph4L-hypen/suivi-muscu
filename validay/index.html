  <style>
  /* ============ Thème : noir & blanc, clair / sombre ============ */
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --card2: #eeeef1;
    --card3: #e4e4e8;
    --line: #e6e6ea;
    --text: #0d0d0f;
    --mute: #85858b;
    --ink: #0d0d0f;          /* couleur « encre » : boutons pleins, barres */
    --on-ink: #ffffff;
    --ok: #0d0d0f;
    --bad: #e5484d;
    --shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(0,0,0,.05), 0 6px 14px rgba(0,0,0,.05), 0 18px 34px rgba(0,0,0,.06);
    --card-grad: linear-gradient(180deg, #ffffff 0%, #f8f8fa 100%);
    --raise: 0 1px 0 rgba(255,255,255,.22) inset, 0 -2px 0 rgba(0,0,0,.28) inset, 0 8px 18px rgba(0,0,0,.2);
    --focus: #3b82f6; --focus-top: rgba(59,130,246,.46);
    --neu: 14px 14px 30px rgba(0,0,0,.10), -12px -12px 26px rgba(255,255,255,.95), inset 0 0 0 1px rgba(0,0,0,.03);
    --ind: #ffffff; --ind-sh: 0 1px 0 rgba(255,255,255,.9) inset, 0 4px 12px rgba(0,0,0,.14);
    --g1: #6ee7a0;           /* 100 % idéal */
    --g2: #22a35a;           /* objectif atteint */
    --or: #f59e0b;
    --rd: #e5484d;
    --tabs-bg: rgba(255,255,255,.5);
    --coach-bg: #0d0d0f; --coach-fg: #ffffff; --coach-chip: rgba(255,255,255,.14);
    --r: 22px;
    --tab-h: 64px;
    --sab: env(safe-area-inset-bottom, 0px);
    --sat: env(safe-area-inset-top, 0px);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #000000;
    --card: #151517;
    --card2: #222225;
    --card3: #2f2f33;
    --line: #26262a;
    --text: #f5f5f7;
    --mute: #8e8e93;
    --ink: #f5f5f7;
    --on-ink: #0d0d0f;
    --ok: #f5f5f7;
    --bad: #ff5c61;
    --g1: #4ade80; --g2: #15803d; --or: #d97706; --rd: #d9363c;
    --tabs-bg: rgba(30,30,34,.5);
    --coach-bg: #1a1a1d; --coach-fg: #f5f5f7; --coach-chip: #2a2a2e;
    --shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 10px 26px rgba(0,0,0,.55);
    --card-grad: linear-gradient(180deg, #1d1d20 0%, #131315 100%);
    --raise: 0 1px 0 rgba(255,255,255,.7) inset, 0 -2px 0 rgba(0,0,0,.22) inset, 0 8px 18px rgba(0,0,0,.5);
    --focus: #5b9dff; --focus-top: rgba(37,99,235,.55);
    --neu: 14px 14px 30px rgba(0,0,0,.65), -10px -10px 24px rgba(255,255,255,.035), inset 0 0 0 1px rgba(255,255,255,.04);
    --ind: rgba(255,255,255,.13); --ind-sh: 0 1px 0 rgba(255,255,255,.14) inset, 0 4px 12px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.4; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  body { position: fixed; inset: 0; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  ::-webkit-scrollbar { display: none; }

  /* ============ Structure ============ */
  #app { position: absolute; inset: 0; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
  @media (min-width: 600px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
  #pager { position: absolute; inset: 0; overflow: hidden; background: #000; touch-action: pan-y; }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: var(--bg);
    padding: calc(14px + var(--sat)) 18px calc(var(--tab-h) + var(--sab) + 110px);
    transform: translate3d(100%,0,0); will-change: transform; backface-visibility: hidden; }
  .screen.anim { transition: transform .46s cubic-bezier(.22,.9,.24,1), opacity .46s ease, border-radius .46s, box-shadow .46s; }
  /* Focus : la page vit « derrière » les autres, avec un halo bleu sur le premier cinquième */
  #s-focus { background: linear-gradient(180deg, var(--focus-top) 0%, transparent 20%), var(--bg); transform-origin: 50% 40%; }
  /* Progrès : halo vert qui monte du bas. Profil : pièce sans fin, sol quadrillé en perspective */

  #s-progress .card, #s-progress .kpi, #s-profile .card, #s-profile .kpi { background: var(--glass); -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); }
  .screen > * + * { margin-top: 16px; }

  /* Barre d'onglets */
  /* Barre flottante, translucide */
  #tabs { position: absolute; left: 14px; right: 14px; bottom: calc(var(--sab) + 12px); height: var(--tab-h);
    padding: 0 6px; background: var(--tabs-bg);
    backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 32px;
    box-shadow: 0 14px 34px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.06); display: flex; z-index: 20; }
  [data-theme="dark"] #tabs { box-shadow: 0 14px 34px rgba(0,0,0,.5); }
  #tabind { position: absolute; left: 6px; top: 6px; bottom: 6px; width: calc((100% - 12px) / 4); border-radius: 26px;
    background: var(--ind); box-shadow: var(--ind-sh); pointer-events: none; will-change: transform; }
  #tabind.anim { transition: transform .46s cubic-bezier(.22,.9,.24,1); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; z-index: 1;
    color: var(--mute); font-size: 11px; font-weight: 500; transition: transform .16s cubic-bezier(.3,.7,.4,1.4), color .2s; }
  .tab svg { width: 24px; height: 24px; transition: transform .16s; }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.press { transform: scale(.84) translateY(1px); }
  .tab.press svg { transform: scale(.9); }
  @keyframes tabpop { 0% { transform: scale(.8); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .tab.bump svg { animation: tabpop .36s cubic-bezier(.3,.7,.4,1.3); }
  .tab[data-tab="focus"].active { color: var(--focus); }
  #fab { position: absolute; right: 18px; bottom: calc(var(--tab-h) + var(--sab) + 30px); width: 60px; height: 60px;
    border-radius: 50%; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center;
    box-shadow: var(--raise); z-index: 21; transition: transform .15s, opacity .25s, box-shadow .15s; }
  #fab:active { transform: scale(.92) translateY(2px); box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 3px 8px rgba(0,0,0,.25); }
  #fab svg { width: 28px; height: 28px; }
  #fab.hidden { opacity: 0; transform: scale(.6); pointer-events: none; }

  /* Icônes */
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ============ En-tête ============ */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .head h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .head .sub { color: var(--mute); margin-top: 4px; font-size: 15px; }
  .head .tools { display: flex; gap: 8px; margin-top: 4px; }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center; color: var(--text); border: 1px solid var(--line); }
  .ibtn.active { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .link { color: var(--mute); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* ============ Cartes & éléments ============ */
  .card { background: var(--card-grad); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
  .card.flat { box-shadow: none; background: var(--card2); }
  .card-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .sect { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; margin-bottom: 10px; }
  .sect h2 { font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; position: relative; padding-bottom: 7px; }
  .sect h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 28px; height: 3px; background: var(--ink); border-radius: 2px; }
  .sect .count { color: var(--mute); font-size: 13px; font-weight: 600; }
  .sect button.chev { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--mute); }
  .sect button.chev svg { transition: transform .2s; }
  .sect.closed button.chev svg { transform: rotate(-90deg); }

  .bar { height: 8px; background: var(--card3); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .35s; }
  .bar.thin { height: 5px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 99px;
    background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--text); }
  .chip.sel { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--mute)); }
  .chip .n { color: var(--mute); font-weight: 500; }
  .chip.sel .n { color: inherit; opacity: .7; }
  .chips.wrap { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }

  .seg { display: flex; background: var(--card2); border-radius: 14px; padding: 4px; }
  .seg button { flex: 1; padding: 9px 4px; border-radius: 11px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: var(--mute); }
  .seg button.sel { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  [data-theme="dark"] .seg button.sel { background: var(--card3); box-shadow: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 14px;
    font-weight: 700; font-size: 15px; background: var(--card2); color: var(--text); width: 100%; transition: transform .1s; }
  .btn:active { transform: scale(.97) translateY(1px); }
  .btn.primary { background: var(--ink); color: var(--on-ink); box-shadow: var(--raise); }
  .btn.primary:active { box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 2px 6px rgba(0,0,0,.2); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .btn.danger { color: var(--bad); background: transparent; }
  .btn.sm { padding: 9px 14px; font-size: 13px; width: auto; border-radius: 11px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .mute { color: var(--mute); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .b { font-weight: 700; }
  .num { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .empty { text-align: center; color: var(--mute); padding: 36px 16px; font-size: 14px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; display: flex; justify-content: center; }
  .empty .big svg { width: 40px; height: 40px; stroke-width: 1.4; }

  /* Anneaux SVG */
  .ring .ring-bg { fill: none; stroke: var(--card3); }
  .ring .ring-fg { fill: none; stroke: var(--ink); stroke-linecap: round; transition: stroke-dashoffset .4s; }

  /* ============ Bandeau semaine ============ */
  .week { display: flex; justify-content: space-between; align-items: flex-start; position: relative; padding: 4px 2px 0; }
  .week::before { content: ""; position: absolute; left: 20px; right: 20px; top: 40px; height: 2px; background: var(--card3); z-index: 0; }
  .wday { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 44px; }
  .wday .lbl { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; }
  .wday .circ { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--text); background: var(--bg); border-radius: 50%; }
  .wday .circ svg { position: absolute; inset: 0; }
  .wday.sel .circ { background: var(--ink); color: var(--on-ink); }
  .wday.sel .circ .ring-fg { stroke: var(--on-ink); }
  .wday.sel .circ .ring-bg { stroke: transparent; }
  .wday.future .circ { color: var(--mute); }
  .wday.future .circ .ring-bg { stroke: var(--card2); }
  .wday.today .lbl { color: var(--text); }

  /* ============ Ligne d'habitude ============ */
  .hlist { display: flex; flex-direction: column; gap: 10px; }
  .hrow { display: flex; align-items: center; gap: 14px; background: var(--card-grad); border-radius: var(--r); padding: 14px 14px 14px 16px;
    box-shadow: var(--shadow); position: relative; overflow: hidden; transition: opacity .2s, transform .15s;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .hrow.held { transform: scale(.97); }
  .hsub .late { color: var(--bad); font-weight: 600; }
  .hrow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, transparent); opacity: .9; z-index: 2; }
  .hrow::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p, 0) * 100%);
    background: color-mix(in srgb, var(--c, var(--mute)) 16%, var(--card2)); transition: width .35s; z-index: 0; }
  [data-theme="dark"] .hrow::after { background: color-mix(in srgb, var(--c, var(--mute)) 20%, var(--card2)); }
  .hrow > * { position: relative; z-index: 1; }
  .hrow.done { opacity: .7; }
  .hrow.done .hname { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--mute); }
  .hrow.locked { opacity: .5; }
  .hicon { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text); }
  .hicon svg { width: 22px; height: 22px; }
  .hi { width: 16px; height: 16px; vertical-align: -3px; }
  .chip .hi, .pill .hi { width: 14px; height: 14px; }
  .sh-head h2 .hi { width: 22px; height: 22px; vertical-align: -4px; margin-right: 6px; }
  .sect h2 .hi { width: 14px; height: 14px; }
  .hbody { flex: 1; min-width: 0; }
  .hname { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hsub { color: var(--mute); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hsub .fl { color: var(--text); font-weight: 600; }
  .hcheck { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--card3); display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .15s; position: relative; background: var(--card);
    box-shadow: 0 2px 5px rgba(0,0,0,.08), 0 -2px 0 rgba(0,0,0,.05) inset; }
  .hcheck svg { width: 20px; height: 20px; stroke-width: 2.4; }
  .hrow.done .hcheck { background: var(--ink); border-color: var(--ink); color: var(--on-ink); box-shadow: 0 2px 4px rgba(0,0,0,.25) inset; }
  .hcheck.ring { border: 0; }
  .hcheck.ring svg.ring { position: absolute; inset: 0; width: 40px; height: 40px; }
  .hcheck.ring .plus { color: var(--text); font-size: 20px; font-weight: 600; line-height: 1; position: relative; }
  .hrow.done .hcheck.ring .plus { color: var(--on-ink); }
  .hcheck:active { transform: scale(.9); }
  .hrow.neg .hcheck { border-style: dashed; }
  .steps-mini { display: flex; gap: 3px; margin-top: 6px; }
  .steps-mini i { height: 4px; flex: 1; max-width: 26px; border-radius: 2px; background: var(--card3); }
  .steps-mini i.on { background: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; background: var(--card2); font-size: 11px; font-weight: 700; color: var(--text); }
  .pill.ok { background: var(--ink); color: var(--on-ink); }

  /* ============ Feuilles (bottom sheets) ============ */
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 92%; background: var(--bg);
    border-radius: 26px 26px 0 0; z-index: 41; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
  #sheet.open { transform: translateY(0); }
  #sheet .handle { width: 40px; height: 5px; border-radius: 3px; background: var(--card3); margin: 10px auto 0; flex: none; }
  #sheet .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 6px; flex: none; gap: 10px; }
  #sheet .sh-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  #sheet .sh-body { overflow-y: auto; padding: 8px 18px calc(24px + var(--sab)); flex: 1; }
  #sheet .sh-body > * + * { margin-top: 14px; }
  .close { width: 34px; height: 34px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; color: var(--text); }
  .close svg { width: 18px; height: 18px; }

  /* Formulaires */
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .inp { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; outline: none; }
  .inp:focus { border-color: var(--ink); }
  textarea.inp { min-height: 76px; resize: vertical; }
  .inp-row { display: flex; gap: 8px; }
  .inp-row .inp { min-width: 0; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-height: 232px; overflow-y: auto; padding: 2px; }
  .emoji-grid button { aspect-ratio: 1; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 20px; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .emoji-grid button svg { width: 20px; height: 20px; }
  .emoji-grid button.sel { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 30px; height: 30px; border-radius: 50%; background: var(--sw); border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
  .swatches button.sel { border-color: var(--bg); box-shadow: 0 0 0 2px var(--ink); }
  .swatches label { width: 30px; height: 30px; border-radius: 50%; border: 1px dashed var(--mute); display: flex; align-items: center; justify-content: center; color: var(--mute); position: relative; overflow: hidden; }
  .swatches label input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .days { display: flex; gap: 6px; }
  .days button { flex: 1; aspect-ratio: 1; max-height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .days button.sel { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .stepper { display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .stepper button { width: 44px; height: 44px; font-size: 22px; font-weight: 500; color: var(--text); }
  .stepper span { min-width: 52px; text-align: center; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .switch { position: relative; width: 50px; height: 30px; border-radius: 99px; background: var(--card3); transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch.on { background: var(--ink); }
  .switch.on::after { transform: translateX(20px); background: var(--on-ink); }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .opt-row:last-child { border-bottom: 0; }
  .opt-row .t { font-weight: 600; }
  .opt-row .d { color: var(--mute); font-size: 13px; margin-top: 2px; }
  .steplist { display: flex; flex-direction: column; gap: 8px; }
  .steplist .row .inp { flex: 1; }
  .slider { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 99px; background: var(--card3); outline: none; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .checkline { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
  .checkline .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--card3); display: flex; align-items: center; justify-content: center; color: transparent; flex: none; }
  .checkline .box svg { width: 16px; height: 16px; stroke-width: 3; }
  .checkline.on .box { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .checkline.on .lbl { color: var(--mute); text-decoration: line-through; }

  /* ============ Progrès ============ */
  .kpi { background: var(--card-grad); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; }
  .kpi .lbl { font-size: 12px; color: var(--mute); font-weight: 600; }
  .kpi .num { margin-top: 6px; font-size: 26px; }
  .kpi .delta { font-size: 12px; margin-top: 4px; font-weight: 600; color: var(--mute); }
  .delta.up { color: #2aa84a; } .delta.down { color: var(--bad); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .dh { text-align: center; font-size: 11px; color: var(--mute); font-weight: 600; text-transform: uppercase; padding-bottom: 4px; }
  .cal .d { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
    background: var(--card2); color: var(--text); position: relative; }
  .cal .d.l1 { background: var(--rd); color: #fff; }
  .cal .d.l2 { background: var(--or); color: #fff; }
  .cal .d.l3 { background: var(--g2); color: #fff; }
  .cal .d.l4 { background: var(--g1); color: #0d0d0f; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 12px; font-size: 11px; color: var(--mute); font-weight: 600; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
  .cal .d.rest { background: repeating-linear-gradient(45deg, var(--card2) 0 4px, var(--card3) 4px 8px); color: var(--mute); }
  .cal .d.off { opacity: .3; }
  .cal .d.today::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .cal .d.empty { background: transparent; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
  .bars .bcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; }
  .bars .bcol i { width: 100%; max-width: 26px; background: var(--ink); border-radius: 5px 5px 2px 2px; min-height: 2px; opacity: .9; }
  .bars .bcol.cur i { opacity: 1; }
  .bars .bcol.rest i { background: var(--card3); }
  .bars .bcol small { font-size: 10px; color: var(--mute); font-weight: 600; }
  .hbar { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .hbar .lbl { width: 110px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .hbar .bar { flex: 1; }
  .hbar .v { width: 40px; text-align: right; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .streak-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .streak-row:last-child { border-bottom: 0; }
  .streak-row .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .streak-row .ic svg { width: 18px; height: 18px; }
  .streak-row[data-act] { cursor: pointer; }
  .hbar[data-act] { cursor: pointer; }
  .hbar .chev { color: var(--mute); width: 18px; display: flex; }
  .hbar .chev svg { width: 16px; height: 16px; }
  .dots7 { display: flex; gap: 4px; }
  .dots7 i { width: 9px; height: 9px; border-radius: 50%; background: var(--card3); }
  .dots7 i.on { background: var(--ink); }
  .dots7 i.na { background: transparent; border: 1px dashed var(--card3); }
  .insight { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .insight:last-child { border-bottom: 0; }
  .insight .em { font-size: 20px; width: 28px; text-align: center; flex: none; display: flex; justify-content: center; color: var(--text); }
  .insight .em svg { width: 20px; height: 20px; }

  /* ============ Focus ============ */
  .timer { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 10px 0; }
  .timer .face { position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, var(--card) 0%, var(--card2) 100%); box-shadow: var(--neu); margin: 8px 0 6px; }
  .timer .face::before { content: ""; position: absolute; inset: 26px; border-radius: 50%; background: var(--card-grad);
    box-shadow: inset 6px 6px 14px rgba(0,0,0,.10), inset -4px -4px 10px rgba(255,255,255,.5); }
  [data-theme="dark"] .timer .face::before { box-shadow: inset 6px 6px 14px rgba(0,0,0,.6), inset -4px -4px 10px rgba(255,255,255,.03); }
  .timer .face .ring-fg { stroke: var(--focus); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--focus) 60%, transparent)); }
  .timer .face .ring-bg { stroke: transparent; }
  #s-focus .card { border-radius: 28px; }
  #s-focus .presets button { box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.5) inset; transition: transform .12s; }
  #s-focus .presets button:active { transform: translateY(2px) scale(.96); box-shadow: none; }
  #s-focus .presets button.sel { background: var(--focus); border-color: var(--focus); color: #fff; box-shadow: 0 6px 14px color-mix(in srgb, var(--focus) 45%, transparent), 0 -2px 0 rgba(0,0,0,.18) inset; }
  #s-focus .bars .bcol i { background: var(--focus); }
  .timer .face svg { position: absolute; inset: 0; }
  .timer .face .ring-bg { stroke-width: 10; }
  .timer .face .ring-fg { stroke-width: 10; }
  .timer .time { font-size: 54px; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
  .timer .phase { color: var(--mute); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
  .presets { display: flex; gap: 8px; width: 100%; align-items: center; }
  .presets .plbl { flex: none; width: 58px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .bars.sm { height: 70px; }

  .sess { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sess:last-child { border-bottom: 0; }

  .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
  .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .badge { text-align: center; }
  .badge .ic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .badge .ic svg { width: 24px; height: 24px; }
  .badge.lock .ic { background: var(--card2); color: var(--mute); opacity: .5; }
  .badge .t { font-size: 11px; font-weight: 600; color: var(--mute); line-height: 1.2; }
  .badge:not(.lock) .t { color: var(--text); }
  .jrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .jrow:last-child { border-bottom: 0; }
  .jrow .mood { font-size: 24px; width: 36px; text-align: center; }
  .mini-stats { display: flex; gap: 6px; font-size: 11px; color: var(--mute); font-weight: 600; }
  .mini-stats span b { color: var(--text); }

  /* Coach */
  .coach { background: var(--coach-bg); color: var(--coach-fg); border-radius: var(--r); padding: 16px; }
  [data-theme="dark"] .coach { border: 1px solid var(--line); }
  .coach .card-title { color: var(--coach-fg); opacity: .6; }
  .coach p { margin-top: 8px; font-size: 15px; font-weight: 500; line-height: 1.45; }
  .coach .prio { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .coach .prio span { padding: 5px 10px; border-radius: 99px; background: var(--coach-chip); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .coach .btn.sm { margin-top: 12px; background: var(--coach-chip); color: var(--coach-fg); }

  /* Toast */
  #toast { position: absolute; left: 50%; bottom: calc(var(--tab-h) + var(--sab) + 104px); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--on-ink);
    padding: 11px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; opacity: 0; transition: all .25s; z-index: 50; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .pop { animation: pop .3s ease; }
  </style>

/* ---------- Règles métier ---------- */
function isDue(h, date) {

/* ---------- Coach (règles locales) ---------- */
function coach(date) {

  const s = dayStats(date);
  const notDone = active.filter(h => isDue(h, date) && !isDone(h, date));
  // priorités : séries en jeu, puis habitudes difficiles, puis les moins régulières

  const msgs = [];

  if (risk && hour >= 17) msgs.push(`Ta série de ${streak(risk)} jours sur « ${risk.name} » se joue ce soir. Deux minutes suffisent pour la garder vivante.`);
  const y = dayStats(ymd(addDays(t, -1)));

  const strong = active.filter(h => isDaily(h)).map(h => ({ h, r: habitRate(h, 14) })).filter(x => x.r.due >= 5).sort((a, b) => b.r.rate - a.r.rate)[0];
  if (weak) msgs.push(`« ${weak.h.name} » n'est réussie que ${Math.round(weak.r.rate * 100)} % du temps sur deux semaines.` + (strong && strong.h !== weak.h ? ` Essaie de la caler juste après « ${strong.h.name} », qui tient déjà bien.` : ' Réduis l\'objectif minimum pour la rendre impossible à rater.'));

  if (bd && bd.n >= 3 && Math.random() < .5) msgs.push(`Tes ${bd.name}s sont tes jours les plus réguliers (${Math.round(bd.rate * 100)} %). Place-y les habitudes les plus exigeantes.`);

/* ---------- Rendu : helpers ---------- */
function ring(p, size, stroke, extra) {

}
function sub(h, date) {
  const parts = [];
  const ai = agendaInfo(h, date);
  if (ai && ai.rest) return `${ico('cal')} ` + (norm(ai.rest.t).trim() === norm(S.settings.restWord).trim() ? 'Repos prévu à l\'agenda' : 'Repos · ' + esc(ai.rest.t));
  if (ai && ai.match) parts.push(`${ico('cal')} ${esc(ai.match.t)}${ai.match.h ? ' ' + ai.match.h : ''}`);
  const e = log(date, h.id);
  if (h.kind === 'count') parts.push(`${e && e.v ? e.v : 0}/${h.goal.ideal || h.goal.min} ${h.goal.unit}` + (h.goal.min && h.goal.ideal && h.goal.min !== h.goal.ideal ? ` · min ${h.goal.min}` : ''));
  else if (h.kind === 'steps') parts.push(`${(e && e.steps || []).filter(Boolean).length}/${h.steps.length} étapes`);
  if (!isDaily(h) && h.freq.kind === 'weekly') parts.push(`${periodCount(h, date)}/${h.freq.n} cette semaine`);
  if (!isDaily(h) && h.freq.kind === 'monthly') parts.push(`${periodCount(h, date)}/${h.freq.n} ce mois`);
  if (h.time) parts.push(h.time);
  const st = streak(h);
  if (st >= 2) parts.push(`<span class="fl">${ico('flame')} ${st}</span>`);
  if (h.type === 'neg' && !parts.length) parts.push('À éviter');
  if (h.challenge) { const d = Math.floor((today() - parse(h.challenge.start)) / 864e5) + 1; if (d <= h.challenge.days) parts.push(`Défi ${d}/${h.challenge.days}`); }
  return parts.join(' · ');
}
function habitRow(h, date, locked) {
  const done = isDone(h, date), c = cat(h.cat), p = progress(h, date);
  let check;
  if (h.kind === 'count' || h.kind === 'steps') check = `<button class="hcheck ring" data-act="inc" data-id="${h.id}">${ring(p, 40, 3.5)}<span class="plus">${done ? SVG.check : '+'}</span></button>`;
  else check = `<button class="hcheck" data-act="toggle" data-id="${h.id}">${SVG.check}</button>`;
  const ai = agendaInfo(h, date);
  if (ai && ai.rest) check = `<span class="pill ok">Repos</span>`;
  const steps = h.kind === 'steps' ? `<div class="steps-mini">${h.steps.map((s, i) => `<i class="${(log(date, h.id) || {}).steps?.[i] ? 'on' : ''}"></i>`).join('')}</div>` : '';
  return `<div class="hrow ${done ? 'done' : ''} ${h.type === 'neg' ? 'neg' : ''} ${locked ? 'locked' : ''}" style="--c:${c.color};--p:${done ? 1 : p.toFixed(3)}" data-id="${h.id}">
    <div class="hicon">${ico(h.icon)}</div>
    <div class="hbody" data-act="open" data-id="${h.id}"><div class="hname">${esc(h.name)}</div><div class="hsub">${sub(h, date)}</div>${steps}</div>
    ${locked ? '' : check}</div>`;
}
function momentOf(h) {
  if (h.moment && h.moment !== 'auto') return h.moment;
  if (h.time) { const hh = +h.time.slice(0, 2); return hh < 12 ? 'matin' : hh < 18 ? 'midi' : 'soir'; }
  return 'any';
}

      <div class="insight"><div class="em">${ico('clock')}</div><div><div class="b">Focus cette semaine</div><div class="mute small">${fmtDur(focusWeek)} · ${fmtDur(g.focusMin)} au total</div></div></div>

function journalInsight() {
  const entries = Object.entries(S.journal);

/* ---------- Écran : Focus ---------- */
let tick = null;
function renderFocus() {
  const el = document.getElementById('s-focus');
  const cur = S.focus.current, work = S.settings.focusWork, brk = S.settings.focusBreak;
  const total = cur ? cur.duration * 60 : work * 60;
  const left = cur ? remainingSec(cur) : total;
  const p = cur ? 1 - left / total : 0;
  const t = today(), sess = S.focus.sessions;
  const sum = a => a.reduce((x, y) => x + y.min, 0);
  const todaySess = sess.filter(x => x.date === TODAY());
  const weekSess = sess.filter(x => x.date >= weekKey(t));
  const pweekSess = sess.filter(x => x.date >= ymd(addDays(startOfWeek(t), -7)) && x.date < weekKey(t));
  const monthSess = sess.filter(x => x.date >= monthKey(t) + '-01');
  const avg = sess.length ? Math.round(sum(sess) / sess.length) : 0;
  const longest = sess.length ? Math.max(...sess.map(x => x.min)) : 0;
  // jours consécutifs avec au moins une session
  let fstreak = 0; { const days = new Set(sess.map(x => x.date)); let d = days.has(TODAY()) ? t : addDays(t, -1); while (days.has(ymd(d))) { fstreak++; d = addDays(d, -1); } }
  // 7 derniers jours
  const days7 = Array.from({ length: 7 }, (_, i) => { const d = addDays(startOfWeek(t), i), k = ymd(d); return { k, d, min: sum(sess.filter(x => x.date === k)) }; });
  const maxD = Math.max(30, ...days7.map(x => x.min));
  const wkDelta = pweekSess.length ? sum(weekSess) - sum(pweekSess) : null;
  const hist = sess.slice(-8).reverse();
  const presets = (key, vals, cur) => vals.map(m => `<button class="${cur === m ? 'sel' : ''}" data-act="${key}" data-m="${m}">${m}</button>`).join('') + `<button class="${!vals.includes(cur) ? 'sel' : ''}" data-act="${key}-custom">${!vals.includes(cur) ? cur : '…'}</button>`;

  el.innerHTML = `
    <div class="head"><div><h1>Focus</h1><p class="sub">${fmtDur(sum(todaySess))} aujourd'hui · ${todaySess.length} session${todaySess.length > 1 ? 's' : ''}</p></div></div>
    <div class="card"><div class="timer">
      <div class="face">${ring(p, 250, 10)}<div style="text-align:center;position:relative"><div class="time">${pad(Math.floor(left / 60))}:${pad(left % 60)}</div><div class="phase">${cur ? (cur.phase === 'break' ? 'Pause' : cur.paused ? 'En pause' : 'Deep work') : `${work} min · pause ${brk} min`}</div></div></div>
      ${cur ? '' : `<div class="presets"><span class="plbl">Travail</span>${presets('work', [25, 45, 60, 90], work)}</div>
      <div class="presets"><span class="plbl">Pause</span>${presets('break', [5, 10, 15, 20], brk)}</div>`}
      <div class="fctrl">
        ${!cur ? `<button class="btn primary" data-act="f-start">${SVG.play} Lancer ${work} min</button>`
        : cur.paused ? `<button class="btn primary" data-act="f-resume">${SVG.play} Reprendre</button><button class="btn circle" data-act="f-stop" title="Arrêter">${SVG.stop}</button>`
        : `<button class="btn" data-act="f-pause">${SVG.pause} Pause</button><button class="btn circle" data-act="f-stop" title="Arrêter">${SVG.stop}</button>`}
      </div>
    </div></div>

    <div class="grid3">
      <div class="kpi"><div class="lbl">Semaine</div><div class="num" style="font-size:20px;margin-top:10px">${fmtDur(sum(weekSess))}</div>${wkDelta != null ? `<div class="delta ${wkDelta > 0 ? 'up' : wkDelta < 0 ? 'down' : ''}">${wkDelta > 0 ? '▲' : wkDelta < 0 ? '▼' : '='} ${fmtDur(Math.abs(wkDelta))}</div>` : ''}</div>
      <div class="kpi"><div class="lbl">Mois</div><div class="num" style="font-size:20px;margin-top:10px">${fmtDur(sum(monthSess))}</div><div class="delta">${monthSess.length} session${monthSess.length > 1 ? 's' : ''}</div></div>
      <div class="kpi"><div class="lbl">Jours d'affilée</div><div class="num">${fstreak}</div><div class="delta">avec du focus</div></div>
    </div>

    <div class="card"><div class="row between"><div class="card-title">Cette semaine</div><span class="mute xs b">${fmtDur(sum(weekSess))}</span></div>
      <div class="bars sm" style="margin-top:14px">${days7.map(x => `<div class="bcol ${x.k === TODAY() ? 'cur' : ''}"><i style="height:${x.k > TODAY() ? 0 : Math.max(2, 100 * x.min / maxD)}%"></i><small>${DAYS[dow(x.d)]}</small></div>`).join('')}</div></div>

    ${sess.length ? `<div class="card"><div class="card-title">Habitudes de travail</div>
      <div class="insight"><div class="em">${ico('clock')}</div><div><div class="b">Session moyenne</div><div class="mute small">${fmtDur(avg)} · la plus longue ${fmtDur(longest)}</div></div></div>
      <div class="insight"><div class="em">${ico('target')}</div><div><div class="b">Total</div><div class="mute small">${fmtDur(sum(sess))} sur ${sess.length} session${sess.length > 1 ? 's' : ''}</div></div></div>
      ${focusBestHour()}
    </div>` : ''}

    ${hist.length ? `<div class="card"><div class="card-title">Dernières sessions</div>${hist.map(x => `<div class="sess"><div class="grow"><div class="b" style="font-size:14px">${esc(x.label || 'Deep work')}</div><div class="mute xs">${fmtLong(parse(x.date))} · ${x.time || ''}</div></div><div class="b">${fmtDur(x.min)}</div></div>`).join('')}</div>` : '<div class="empty">Aucune session pour l\'instant. Choisis une durée de travail, une pause, et lance-toi.</div>'}`;
}
function focusBestHour() {
  const acc = Array(24).fill(0);
  for (const x of S.focus.sessions) if (x.time) acc[+x.time.slice(0, 2)] += x.min;
  const m = Math.max(...acc); if (!m) return '';
  const h = acc.indexOf(m);
  return `<div class="insight"><div class="em">${ico('sun')}</div><div><div class="b">Créneau préféré</div><div class="mute small">Autour de ${h} h · ${fmtDur(m)} cumulées</div></div></div>`;
}
function remainingSec(cur) {
  if (cur.paused) return cur.remaining;
  return Math.max(0, Math.round((cur.endAt - Date.now()) / 1000));
}
function startTimer(minutes, phase) {
  S.focus.current = { duration: minutes, endAt: Date.now() + minutes * 60000, phase: phase || 'work', startedAt: Date.now() };
  save(); ensureTick(); renderFocus();
}
function ensureTick() {
  if (tick) return;
  tick = setInterval(() => {
    const cur = S.focus.current;
    if (!cur) { clearInterval(tick); tick = null; return; }
    if (!cur.paused && remainingSec(cur) <= 0) finishTimer(true);
    else if (view.tab === 'focus') {
      const left = remainingSec(cur), total = cur.duration * 60;
      const face = document.querySelector('#s-focus .time'); if (face) face.textContent = pad(Math.floor(left / 60)) + ':' + pad(left % 60);
      const fg = document.querySelector('#s-focus .face .ring-fg'); if (fg) { const c = +fg.getAttribute('stroke-dasharray'); fg.setAttribute('stroke-dashoffset', (c * (left / total)).toFixed(2)); }
      document.title = pad(Math.floor(left / 60)) + ':' + pad(left % 60) + ' · ValiDay';
    }
  }, 500);
}
function finishTimer(completed) {
  const cur = S.focus.current; if (!cur) return;
  const elapsedMin = completed ? cur.duration : Math.max(0, Math.round((cur.duration * 60 - remainingSec(cur)) / 60));
  S.focus.current = null; document.title = 'ValiDay';
  if (cur.phase === 'work' && elapsedMin >= 1) {
    S.focus.sessions.push({ id: uid(), date: TODAY(), time: new Date().toTimeString().slice(0, 5), min: elapsedMin });
  }
  save();
  if (completed) {
    beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
    if (cur.phase === 'work') {
      const br = S.settings.focusBreak;
      openSheet('Session terminée', `<p class="mute">${cur.duration} min de deep work enregistrées.</p>
        <button class="btn primary" data-act="f-break" data-m="${br}">Pause de ${br} min</button><button class="btn" data-act="close">Terminer</button>`);
    } else {
      openSheet('Pause terminée', `<p class="mute">Prêt pour une nouvelle session ?</p><button class="btn primary" data-act="f-again">Relancer ${S.settings.focusWork} min</button><button class="btn" data-act="close">Plus tard</button>`);
    }
  }
  renderFocus();
}
function beep() {
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(ctx.currentTime + .5); } catch (e) { }
}

function freqLabel(h) {

  const render = () => {
    sheetEl.querySelector('.sh-body').innerHTML = `
      <div class="field"><label>Nom</label><input class="inp" id="f-name" placeholder="Ex. Lire 20 pages" value="${esc(f.name)}" autocomplete="off"></div>
      <div class="field"><label>Icône</label><div class="emoji-grid">${ICON_KEYS.map(e => `<button class="${f.icon === e ? 'sel' : ''}" data-f="icon" data-v="${e}">${ico(e)}</button>`).join('')}</div></div>
      <div class="field"><label>Catégorie</label><div class="chips wrap">${S.cats.map(c => `<button class="chip ${f.cat === c.id ? 'sel' : ''}" data-f="cat" data-v="${c.id}" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</button>`).join('')}<button class="chip" data-f="newcat">+ Nouvelle</button></div></div>
      <div class="field"><label>Type</label><div class="seg"><button class="${f.type === 'pos' ? 'sel' : ''}" data-f="type" data-v="pos">Bonne habitude</button><button class="${f.type === 'neg' ? 'sel' : ''}" data-f="type" data-v="neg">À éviter</button></div></div>
      <div class="field"><label>Validation</label><div class="seg"><button class="${f.kind === 'check' ? 'sel' : ''}" data-f="kind" data-v="check">Simple ✓</button><button class="${f.kind === 'count' ? 'sel' : ''}" data-f="kind" data-v="count">Compteur</button><button class="${f.kind === 'steps' ? 'sel' : ''}" data-f="kind" data-v="steps">Étapes</button></div>
        ${f.kind === 'count' ? `<div class="inp-row" style="margin-top:8px"><div class="field grow"><label>Minimum</label><input class="inp" type="number" inputmode="decimal" id="f-min" value="${f.goal.min}"></div><div class="field grow"><label>Idéal</label><input class="inp" type="number" inputmode="decimal" id="f-ideal" value="${f.goal.ideal}"></div><div class="field grow"><label>Unité</label><input class="inp" id="f-unit" list="units" value="${esc(f.goal.unit)}"><datalist id="units">${UNITS.map(u => `<option value="${u}">`).join('')}</datalist></div></div><p class="mute xs">Le minimum valide la journée, l'idéal remplit l'anneau. Objectif minimum + idéal = deux niveaux.</p>` : ''}
        ${f.kind === 'steps' ? `<div class="steplist" style="margin-top:8px">${f.steps.map((s, i) => `<div class="row"><input class="inp" data-step="${i}" value="${esc(s)}" placeholder="Étape ${i + 1}"><button class="close" data-f="delstep" data-v="${i}">${SVG.x}</button></div>`).join('')}<button class="btn sm" data-f="addstep">+ Ajouter une étape</button></div>` : ''}
      </div>
      <div class="field"><label>Fréquence</label><div class="seg"><button class="${f.freq.kind === 'daily' ? 'sel' : ''}" data-f="fk" data-v="daily">Quotidien</button><button class="${f.freq.kind === 'days' ? 'sel' : ''}" data-f="fk" data-v="days">Jours</button><button class="${f.freq.kind === 'weekly' ? 'sel' : ''}" data-f="fk" data-v="weekly">/ semaine</button><button class="${f.freq.kind === 'monthly' ? 'sel' : ''}" data-f="fk" data-v="monthly">/ mois</button></div>
        ${f.freq.kind === 'days' ? `<div class="days" style="margin-top:8px">${DAYS.map((d, i) => `<button class="${f.freq.days.includes(i) ? 'sel' : ''}" data-f="day" data-v="${i}">${d}</button>`).join('')}</div>` : ''}
        ${f.freq.kind === 'daily' ? `<div style="margin-top:8px"><div class="mute xs" style="margin-bottom:6px">Jours de repos (jamais comptés comme manqués)</div><div class="days">${DAYS.map((d, i) => `<button class="${f.rest.includes(i) ? 'sel' : ''}" data-f="rest" data-v="${i}">${d}</button>`).join('')}</div></div>` : ''}
        ${f.freq.kind === 'weekly' || f.freq.kind === 'monthly' ? `<div class="row" style="margin-top:8px"><div class="stepper"><button data-f="fn" data-v="-1">−</button><span>${f.freq.n}</span><button data-f="fn" data-v="1">+</button></div><span class="mute small">fois par ${f.freq.kind === 'weekly' ? 'semaine' : 'mois'}, quand tu veux</span></div>` : ''}
      </div>
      <div class="field"><label>Agenda</label><div class="card flat" style="padding:4px 14px">
        <div class="opt-row" style="border:0"><div><div class="t">Seulement si prévu à l'agenda</div><div class="d">Demandée uniquement les jours où un événement contient le mot-clé. Un événement « ${esc(S.settings.restWord || 'repos')} » la valide comme repos.</div></div><button class="switch ${f.agenda.on ? 'on' : ''}" data-f="agenda"></button></div>
        ${f.agenda.on ? `<div style="padding:0 0 12px"><input class="inp" id="f-aword" placeholder="Mot-clé, ex. sport" value="${esc(f.agenda.word)}" style="background:var(--card)">${S.settings.agendaUrl ? '' : '<p class="mute xs" style="margin-top:6px">Agenda pas encore connecté : Profil → Agenda.</p>'}</div>` : ''}
      </div></div>
      <div class="field"><label>Moment & heure idéale</label><div class="seg">${MOMENTS.map(([k, l]) => `<button class="${f.moment === k ? 'sel' : ''}" data-f="moment" data-v="${k}">${l.replace('Dans la journée', 'Libre')}</button>`).join('')}</div>
        <div class="inp-row" style="margin-top:8px"><input class="inp" type="time" id="f-time" value="${f.time || ''}" style="flex:1"><button class="checkline" data-f="reminder" style="flex:1"><span class="box ${f.reminder ? '' : ''}" style="${f.reminder ? 'background:var(--ink);border-color:var(--ink);color:var(--on-ink)' : ''}">${SVG.check}</span><span>Rappel</span></button></div></div>
      <div class="field"><label>Difficulté · points par validation</label><div class="seg"><button class="${f.points === 1 ? 'sel' : ''}" data-f="pts" data-v="1">Facile · 10</button><button class="${f.points === 2 ? 'sel' : ''}" data-f="pts" data-v="2">Moyen · 20</button><button class="${f.points === 3 ? 'sel' : ''}" data-f="pts" data-v="3">Difficile · 30</button></div></div>
      <div class="opt-row" style="border:0;padding:4px 0"><div><div class="t">Essentielle</div><div class="d">Reste due en « journée minimum ».</div></div><button class="switch ${f.core ? 'on' : ''}" data-f="core"></button></div>
      <div class="field"><label>Description / déclencheur</label><textarea class="inp" id="f-desc" placeholder="Ex. Juste après le café du matin">${esc(f.desc || '')}</textarea></div>
      <button class="btn primary" data-f="save">${id ? 'Enregistrer' : 'Créer l\'habitude'}</button>
      ${id ? `<button class="btn danger" data-f="delete">Supprimer définitivement</button>` : ''}`;
  };
  const sync = () => {   // lit les champs texte avant un re-rendu
    const q = s => sheetEl.querySelector(s);
    if (q('#f-name')) f.name = q('#f-name').value;
    if (q('#f-min')) f.goal.min = +q('#f-min').value || 1;
    if (q('#f-ideal')) f.goal.ideal = +q('#f-ideal').value || f.goal.min;
    if (q('#f-unit')) f.goal.unit = q('#f-unit').value.trim() || 'fois';
    if (q('#f-time')) f.time = q('#f-time').value;
    if (q('#f-desc')) f.desc = q('#f-desc').value;
    if (q('#f-aword')) f.agenda.word = q('#f-aword').value.trim();
    sheetEl.querySelectorAll('[data-step]').forEach(i => f.steps[+i.dataset.step] = i.value);
  };
  openSheet(id ? 'Modifier' : 'Nouvelle habitude', '', {
    form: true,
    onAction: (k, v) => {
      sync();
      switch (k) {
        case 'icon': f.icon = v; break;
        case 'cat': f.cat = v; break;
        case 'newcat': { const n = prompt('Nom de la catégorie'); if (n && n.trim()) { const c = { id: uid(), name: n.trim(), color: pickColor() }; S.cats.push(c); f.cat = c.id; save(); } break; }
        case 'type': f.type = v; break;
        case 'kind': f.kind = v; if (v === 'steps' && !f.steps.length) f.steps = ['', '']; if (v === 'count' && f.goal.unit === 'fois' && f.goal.ideal === 1) { f.goal = { min: 1, ideal: 1, unit: 'fois' }; } break;
        case 'addstep': f.steps.push(''); break;
        case 'delstep': f.steps.splice(+v, 1); break;
        case 'fk': f.freq.kind = v; break;
        case 'day': { const i = +v, a = f.freq.days; a.includes(i) ? a.splice(a.indexOf(i), 1) : a.push(i); break; }
        case 'rest': { const i = +v, a = f.rest; a.includes(i) ? a.splice(a.indexOf(i), 1) : a.push(i); break; }
        case 'fn': f.freq.n = Math.max(1, f.freq.n + +v); break;
        case 'moment': f.moment = v; break;
        case 'reminder': f.reminder = !f.reminder; if (f.reminder && !f.time) f.time = '09:00'; if (f.reminder) askNotif(); break;
        case 'pts': f.points = +v; break;
        case 'core': f.core = !f.core; break;
        case 'agenda': f.agenda.on = !f.agenda.on; if (f.agenda.on && !f.agenda.word) f.agenda.word = norm(cat(f.cat).name === 'Sport' ? 'sport' : (f.name.trim().split(/\s+/)[0] || 'sport')); break;
        case 'save': {
          if (!f.name.trim()) { toast('Donne un nom à l\'habitude'); return; }
          if (f.kind === 'steps') f.steps = f.steps.map(s => s.trim()).filter(Boolean);
          if (f.kind === 'steps' && !f.steps.length) { toast('Ajoute au moins une étape'); return; }
          if (f.kind === 'count' && f.goal.ideal < f.goal.min) f.goal.ideal = f.goal.min;
          if (f.freq.kind === 'days' && !f.freq.days.length) { toast('Choisis au moins un jour'); return; }
          if (f.agenda.on && !f.agenda.word) { toast('Indique le mot-clé à chercher dans l\'agenda'); return; }
          const i = S.habits.findIndex(x => x.id === f.id);
          if (i >= 0) S.habits[i] = f; else S.habits.push(f);
          save(); closeSheet(); renderAll(); toast(id ? 'Modifié' : 'Habitude créée ✓'); return;
        }
        case 'delete': if (confirm(`Supprimer « ${f.name} » et tout son historique ?`)) { S.habits = S.habits.filter(x => x.id !== f.id); for (const d in S.logs) delete S.logs[d][f.id]; save(); closeSheet(); renderAll(); toast('Supprimée'); } return;
      }
      render();
    }
  });
  render();
  if (!id) setTimeout(() => sheetEl.querySelector('#f-name')?.focus(), 300);
}

/* Journal */
function openJournal(date) {
  const j = Object.assign({ mood: 5, energy: 5, motivation: 5, stress: 5, note: '' }, S.journal[date] || {});
  const sl = (k, l, lo, hi) => `<div class="field"><div class="row between"><label>${l}</label><span class="b" id="jv-${k}">${j[k]}</span></div><input class="slider" type="range" min="0" max="10" step="1" value="${j[k]}" data-j="${k}"><div class="row between mute xs"><span>${lo}</span><span>${hi}</span></div></div>`;
  openSheet('Journal · ' + fmtShort(parse(date)), `
    <div style="text-align:center;font-size:44px" id="j-emo">${moodEmoji(j.mood)}</div>
    ${sl('mood', 'Humeur', 'Mauvaise', 'Excellente')}${sl('energy', 'Énergie', 'Épuisé', 'Plein d\'énergie')}${sl('motivation', 'Motivation', 'Aucune', 'À fond')}${sl('stress', 'Stress', 'Zen', 'Très stressé')}
    <div class="field"><label>Que puis-je améliorer demain ?</label><textarea class="inp" id="j-note" placeholder="Une idée concrète, une seule.">${esc(j.note)}</textarea></div>
    <button class="btn primary" data-act="j-save">Enregistrer</button>`, {
    journal: j, date,
    mount: el => el.querySelectorAll('[data-j]').forEach(i => i.addEventListener('input', () => { j[i.dataset.j] = +i.value; el.querySelector('#jv-' + i.dataset.j).textContent = i.value; if (i.dataset.j === 'mood') el.querySelector('#j-emo').textContent = moodEmoji(+i.value); }))
  });
}

/* Jour passé (depuis le calendrier) */
function openDay(date) {
  const d = parse(date), s = dayStats(date), m = dayMeta(date), j = S.journal[date];
  const due = S.habits.filter(h => isDue(h, date));
  openSheet(fmtLong(d), `
    <div class="row between"><div><span class="num">${s.due ? Math.round(s.rate * 100) + ' %' : '–'}</span> <span class="mute small b">${s.done}/${s.due}${s.bonus ? ' +' + s.bonus : ''}</span></div>${m.joker ? '<span class="pill ok">Joker utilisé</span>' : m.rest ? '<span class="pill">Repos</span>' : ''}</div>
    ${due.length ? `<div class="hlist">${due.map(h => `<div class="hrow ${isDone(h, date) ? 'done' : ''}" style="--c:${cat(h.cat).color};--p:${isDone(h, date) ? 1 : progress(h, date).toFixed(3)}"><div class="hicon">${ico(h.icon)}</div><div class="hbody"><div class="hname">${esc(h.name)}</div><div class="hsub">${isDone(h, date) ? 'Validée' : 'Manquée'}</div></div><div class="hcheck" style="pointer-events:none">${SVG.check}</div></div>`).join('')}</div>` : '<p class="mute">Rien de prévu ce jour-là.</p>'}
    ${j ? `<div class="card flat"><div class="row"><span style="font-size:26px">${moodEmoji(j.mood)}</span><div class="mini-stats"><span>Humeur <b>${j.mood}</b></span><span>Énergie <b>${j.energy}</b></span><span>Motivation <b>${j.motivation}</b></span><span>Stress <b>${j.stress}</b></span></div></div>${j.note ? `<p class="mute small" style="margin-top:8px">« ${esc(j.note)} »</p>` : ''}</div>` : ''}
    <button class="btn" data-act="goto-sheet" data-d="${date}">Ouvrir cette journée</button>
    ${!s.perfect && s.due && !m.joker && date < TODAY() ? `<button class="btn ghost" data-act="joker" data-d="${date}">Protéger avec un joker (${jokersLeft()} restant${jokersLeft() > 1 ? 's' : ''})</button>` : ''}`);
}

/* Bilan de la semaine */
function openReview() {
  const t = today();
  const start = dow(t) === 0 ? addDays(startOfWeek(t), -7) : startOfWeek(t);   // le lundi, on relit la semaine passée
  const r = weekReview(start);
  const fmtR = x => x.rate != null ? Math.round(x.rate * 100) + ' %' : '–';
  const focusMin = S.focus.sessions.filter(s => s.date >= ymd(start) && s.date <= ymd(addDays(start, 6))).reduce((a, s) => a + s.min, 0);
  const js = Object.entries(S.journal).filter(([d]) => d >= ymd(start) && d <= ymd(addDays(start, 6)));
  const avg = k => js.length ? (js.reduce((a, [, j]) => a + j[k], 0) / js.length).toFixed(1) : '–';
  openSheet('Bilan de la semaine', `
    <p class="mute">Semaine du ${fmtShort(start)} au ${fmtShort(addDays(start, 6))}</p>
    <div class="grid2"><div class="kpi"><div class="lbl">Taux de réussite</div><div class="num">${fmtR(r.r)}</div><div class="delta ${r.prev.rate != null && r.r.rate > r.prev.rate ? 'up' : r.prev.rate != null && r.r.rate < r.prev.rate ? 'down' : ''}">${r.prev.rate != null ? 'semaine précédente ' + fmtR(r.prev) : ''}</div></div><div class="kpi"><div class="lbl">Validations</div><div class="num">${r.r.done}<span class="mute" style="font-size:16px">/${r.r.due}</span></div><div class="delta">${fmtDur(focusMin)} de focus</div></div></div>
    <div class="card"><div class="card-title">Réussites</div>${r.wins.length ? r.wins.map(x => `<div class="streak-row"><div class="ic">${ico(x.h.icon)}</div><div class="grow b" style="font-size:14px">${esc(x.h.name)}</div><div class="b">${Math.round(x.rate * 100)} %</div></div>`).join('') : '<p class="mute small" style="margin-top:8px">Pas encore d\'habitude au-dessus de 80 % cette semaine.</p>'}</div>
    <div class="card"><div class="card-title">Échecs</div>${r.fails.length ? r.fails.map(x => `<div class="streak-row"><div class="ic">${ico(x.h.icon)}</div><div class="grow b" style="font-size:14px">${esc(x.h.name)}</div><div class="b" style="color:var(--bad)">${Math.round(x.rate * 100)} %</div></div>`).join('') : '<p class="mute small" style="margin-top:8px">Aucune habitude sous 50 %. Solide.</p>'}</div>
    ${js.length ? `<div class="card flat"><div class="card-title">Journal · moyennes</div><div class="mini-stats" style="margin-top:8px;font-size:13px"><span>Humeur <b>${avg('mood')}</b></span><span>Énergie <b>${avg('energy')}</b></span><span>Motivation <b>${avg('motivation')}</b></span><span>Stress <b>${avg('stress')}</b></span></div></div>` : ''}
    <div class="coach"><div class="card-title">3 priorités pour la semaine prochaine</div>
      ${r.prio.length ? `<ol style="margin:10px 0 0;padding-left:20px;font-weight:600">${r.prio.map(h => `<li style="margin:6px 0">${ico(h.icon)} ${esc(h.name)} <span style="opacity:.6;font-weight:500">— vise le minimum chaque jour</span></li>`).join('')}</ol>` : '<p>Garde le cap : même rythme, et ajoute une seule nouvelle habitude si tu en as envie.</p>'}
    </div>`);
}

/* Onboarding / suggestions */
function openSuggestions(first) {
  const chosen = new Set(first ? [0, 1, 2] : []);
  const render = () => {
    sheetEl.querySelector('.sh-body').innerHTML = `
      ${first ? `<div class="field"><label>Comment tu t'appelles ?</label><input class="inp" id="ob-name" placeholder="Ton prénom" value="${esc(S.settings.name)}"></div>` : ''}
      <div class="field"><label>Habitudes suggérées</label><div class="steplist">${SUGGESTED.filter(s => !S.habits.some(h => h.name === s.name)).map((s, i) => `<button class="checkline ${chosen.has(i) ? 'on' : ''}" data-f="pick" data-v="${i}"><span class="box">${SVG.check}</span><span>${ico(s.icon)} ${esc(s.name)} <span class="mute xs">· ${cat(s.cat).name}</span></span></button>`).join('')}</div></div>
      <button class="btn primary" data-f="go">${first ? 'Commencer' : 'Ajouter la sélection'}</button>
      ${first ? '<button class="btn" data-f="skip">Je crée les miennes</button>' : ''}`;
  };
  openSheet(first ? 'Bienvenue sur ValiDay' : 'Suggestions', '', {
    form: true, onAction: (k, v) => {
      const nameEl = sheetEl.querySelector('#ob-name'); if (nameEl) S.settings.name = nameEl.value.trim();
      if (k === 'pick') { const i = +v; chosen.has(i) ? chosen.delete(i) : chosen.add(i); render(); return; }
      const list = SUGGESTED.filter(s => !S.habits.some(h => h.name === s.name));
      if (k === 'go') list.forEach((s, i) => { if (chosen.has(i)) S.habits.push(fromSuggestion(s)); });
      S.settings.onboarded = true; save(); closeSheet(); renderAll();
      if (k === 'go' && chosen.size) toast(chosen.size + ' habitude' + (chosen.size > 1 ? 's' : '') + ' ajoutée' + (chosen.size > 1 ? 's' : ''));
      if (k === 'skip') openForm();
    }
  });
  render();
}
function fromSuggestion(s) {
  return { id: uid(), name: s.name, icon: s.icon, cat: s.cat, type: s.type || 'pos', kind: s.kind, goal: { min: s.kind === 'count' ? Math.max(1, Math.round(s.goal / 2)) : 1, ideal: s.goal || 1, unit: s.unit || 'fois' }, steps: [],
    freq: s.freq ? Object.assign({ days: [0, 1, 2, 3, 4], n: 3 }, s.freq) : { kind: 'daily', days: [0, 1, 2, 3, 4], n: 3 }, rest: [], moment: s.moment || 'any', time: '', reminder: false, desc: '', points: s.points || 1, core: false, createdAt: TODAY(), agenda: s.agenda ? { ...s.agenda } : { on: false, word: '' } };
}

/* Agenda */

  const q = x => sheetEl.querySelector(x);
  if (q('#ag-url')) { const u = q('#ag-url').value.trim(); if (u && !/^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/]+|macros)\/s\/[\w-]+\/exec$/.test(u)) return false; S.settings.agendaUrl = u; }
  if (q('#ag-rest')) S.settings.restWord = q('#ag-rest').value.trim() || 'repos';
  if (q('#ag-task')) S.settings.taskWord = q('#ag-task').value.trim().replace(/\s*:\s*$/, '') || 'À faire';
  save(); return true;
}

/* ---------- Menus : pile d'écrans qu'on fait glisser ---------- */
const TABS = ['focus', 'today', 'progress', 'profile'];
const RENDER = { today: renderToday, progress: renderProgress, focus: renderFocus, profile: renderProfile };
const pagerEl = document.getElementById('pager'), tabInd = document.getElementById('tabind');
const screenEls = TABS.map(t => document.getElementById('s-' + t));
let pagerPos = 1, dirty = new Set(), dirtyTimer = null;
function layoutPager(pos, anim) {       // pos : position continue (0 = Focus … 3 = Profil)
  screenEls.forEach((el, i) => {
    const o = i - pos;
    el.classList.toggle('anim', !!anim);
    if (i === 0 && o <= 0) {            // Focus recule, rapetisse et s'assombrit quand une autre page passe devant
      el.style.transform = `translate3d(${o * 22}%,0,0) scale(${1 + o * 0.09})`;
      el.style.opacity = String(Math.max(.35, 1 + o * 0.65));
      el.style.borderRadius = (-o * 34) + 'px';
    } else { el.style.transform = `translate3d(${o * 100}%,0,0)`; el.style.opacity = ''; el.style.borderRadius = ''; }
    if (i === 1) el.style.boxShadow = o < .999 ? '-24px 0 50px rgba(0,0,0,.28)' : 'none';   // l'accueil passe par-dessus Focus
    el.style.zIndex = i === 0 ? 1 : 2;
    el.style.visibility = Math.abs(o) > 1.02 ? 'hidden' : 'visible';
  });
  tabInd.classList.toggle('anim', !!anim);
  tabInd.style.transform = `translateX(${Math.max(-.15, Math.min(TABS.length - .85, pos)) * 100}%)`;
}
function setTab(tab, noAnim) {
  const changed = view.tab !== tab;
  view.tab = tab; pagerPos = TABS.indexOf(tab);
  document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('active', on); if (on && changed) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } });
  screenEls.forEach(el => el.classList.toggle('active', el.id === 's-' + tab));
  document.getElementById('fab').classList.toggle('hidden', tab === 'focus' || tab === 'profile');
  layoutPager(pagerPos, !noAnim);
  renderAll();
}
function renderAll() {                  // l'écran courant tout de suite, les autres un peu après (ils servent au glissement)
  RENDER[view.tab]();
  TABS.forEach(t => { if (t !== view.tab) dirty.add(t); }); dirty.delete(view.tab);
  clearTimeout(dirtyTimer); dirtyTimer = setTimeout(flushRenders, 350);
}
function flushRenders() { clearTimeout(dirtyTimer); dirty.forEach(t => RENDER[t]()); dirty.clear(); }

document.querySelectorAll('.tab').forEach(b => {

  swipe = { x: t.clientX, y: t.clientY, t: Date.now(), lock: null, w: pagerEl.clientWidth, p: pagerPos };
}, { passive: true });
pagerEl.addEventListener('touchmove', e => {
  if (!swipe) return;
  const t = e.touches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  if (swipe.lock === null) {
    if (Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
    swipe.lock = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y';
    if (swipe.lock === 'x') { flushRenders(); cancelHold(); }
  }
  if (swipe.lock !== 'x') return;
  if (e.cancelable) e.preventDefault();
  let p = pagerPos - dx / swipe.w; const max = TABS.length - 1;
  if (p < 0) p *= .3; else if (p > max) p = max + (p - max) * .3;     // résistance aux extrémités
  swipe.p = p; swipe.dx = dx; layoutPager(p, false);
}, { passive: false });
const endSwipe = () => {
  const g = swipe; swipe = null;
  if (!g || g.lock !== 'x') return;
  const dx = g.dx || 0, v = dx / Math.max(1, Date.now() - g.t);
  let idx = pagerPos;
  if (dx < -g.w * .2 || v < -.4) idx++; else if (dx > g.w * .2 || v > .4) idx--;
  idx = Math.max(0, Math.min(TABS.length - 1, idx));
  if (idx !== pagerPos) setTab(TABS[idx]); else layoutPager(pagerPos, true);
};
pagerEl.addEventListener('touchend', endSwipe); pagerEl.addEventListener('touchcancel', endSwipe);

/* Appui long sur une habitude : ouvre directement la modification */
let hold = null, holdFired = false;
function cancelHold() { if (hold) { clearTimeout(hold.t); hold.el.classList.remove('held'); hold = null; } }
document.getElementById('app').addEventListener('pointerdown', e => {
  const row = e.target.closest('.hrow[data-id]'); if (!row || e.target.closest('.hcheck, .ibtn')) return;
  cancelHold(); holdFired = false;
  const el = row, x = e.clientX, y = e.clientY;
  hold = { el, x, y, t: setTimeout(() => { el.classList.remove('held'); hold = null; holdFired = true; closeSheet(); openForm(el.dataset.id); }, 520) };
  setTimeout(() => { if (hold && hold.el === el) el.classList.add('held'); }, 140);
});
document.getElementById('app').addEventListener('pointermove', e => { if (hold && (Math.abs(e.clientX - hold.x) > 9 || Math.abs(e.clientY - hold.y) > 9)) cancelHold(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.getElementById('app').addEventListener(n, cancelHold));
document.getElementById('app').addEventListener('click', e => { if (holdFired) { holdFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.getElementById('app').addEventListener('contextmenu', e => { if (e.target.closest('.hrow[data-id]')) e.preventDefault(); });

/* ---------- Thème, notifications, démarrage ---------- */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.settings.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S.settings.theme;
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.setAttribute('content', t === 'dark' ? '#000000' : '#f4f4f6'));
}
mq.addEventListener && mq.addEventListener('change', applyTheme);
function askNotif() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
const notified = new Set();
setInterval(() => {
  if (!S.settings.reminders || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date(), hm = pad(now.getHours()) + ':' + pad(now.getMinutes()), t = TODAY();
  for (const h of S.habits) {
    if (!h.reminder || h.time !== hm || !isDue(h, t) || isDone(h, t) || notified.has(t + h.id)) continue;
    notified.add(t + h.id);
    try { new Notification('ValiDay · ' + h.name, { body: h.desc || 'C\'est le moment. ' + (streak(h) ? 'Série en cours : ' + streak(h) + ' jours.' : ''), icon: 'icons/icon-192.png' }); } catch (e) { }
  }
}, 30000);
// Changement de jour pendant que l'appli est ouverte
setInterval(() => { if (view.date !== TODAY() && view.date === ymd(addDays(today(), -1)) && view.tab === 'today' && !sheetEl.classList.contains('open')) { view.date = TODAY(); renderToday(); } }, 60000);
const agendaStale = () => S.settings.agendaUrl && (!S.agenda || Date.now() - S.agenda.at > 15 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.focus.current) ensureTick(); renderAll(); if (agendaStale()) syncAgenda(false); } });

applyTheme();
layoutPager(pagerPos, false);
renderAll();
if (S.focus.current) ensureTick();
if (agendaStale()) syncAgenda(false);
if (!S.settings.onboarded) setTimeout(() => openSuggestions(true), 300);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
